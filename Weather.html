<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="style.css" type="text/css" media="all" />
  <title>Weather</title>
</head>
<body>
  <div class="card">
    <div class="search">
      <input type= "text" placeholder="City Name" spellcheck="false" />
      <button> <img src="search.png" /></button>
      
    </div>
    
  <div class="weather">
    <img class="weather-icon" src="rain.png" />
    <h1 class="temp"> 18°c</h1>
    <h2 class="city"> Chennai</h2>
    <div class="details">
      <div class="col">
          <img src="humidity.png" >
        <div>
          <p class="humidity">50%</p>
          <p>Humidity</p>
        </div>
        
      </div>
            <div class="col">
          <img src="wind.png" >
        <div>
          <p class="wind">10km/h</p>
          <p>Wind</p>
        </div>
        
      </div>
      
    </div>
    
  </div>
  </div>
<script type="text/javascript" charset="utf-8">
    const apiKey = "40c8105666731378eae50b18b2579b13";
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";
    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");
    const weatherIcon = document.querySelector(".weather-icon");
    
    async function checkWeather(city) {
        const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
        var data = await response.json();
      //  console.log(data);
        document.querySelector(".city").innerHTML = data.name;
        document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
        document.querySelector(".humidity").innerHTML = Math.round(data.main.humidity) + "%";
        document.querySelector(".wind").innerHTML = Math.round(data.wind.speed) + "km/h";
        
        if (data.weather[0].main == "Clouds") {
            weatherIcon.src = "cloud.png";
        } else if (data.weather[0].main == "Rain") {
            weatherIcon.src = "rain.png";
        } else if (data.weather[0].main == "Clear") {
            weatherIcon.src = "clear.png";
        } else if (data.weather[0].main == "Mist") {
            weatherIcon.src = "snow.png";
        } else {
            weatherIcon.src = "sun.png"; // Provide a default image in case none of the conditions match
        }
       document.querySelector(".weather").style.display="block";
    }
    
    searchBtn.addEventListener("click", () => {
        checkWeather(searchBox.value);
    });
</script>

</body>
</html>
    }
